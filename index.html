<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>home / login</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="login-body">

  <main class="login-panel" role="main">
    <div class="login-header">
      <span class="status-dot" id="status-dot" aria-hidden="true"></span>
      <span class="login-eyebrow">home terminal</span>
    </div>

    <h1 class="login-title">Sign in</h1>

    <form id="login-form" class="login-form" novalidate>
      <label class="field-label" for="email">Email</label>
      <input class="field-input" type="email" id="email" name="email" autocomplete="username" required />

      <label class="field-label" for="password">Password</label>
      <input class="field-input" type="password" id="password" name="password" autocomplete="current-password" required />

      <button class="btn-primary" type="submit">Unlock</button>

      <p class="login-error" id="login-error" role="alert" aria-live="polite"></p>
    </form>
  </main>

  <!-- Firebase SDKs (compat build — no bundler needed) -->
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-storage-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="auth.js"></script>
</body>
</html>
